{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "visa-k8s-controller.fullname" . }}-test-connection"
  namespace: {{ include "visa-k8s-controller.namespace" . }}
  labels:
    {{- include "visa-k8s-controller.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '-', 'http://{{ include "visa-k8s-controller.fullname" . }}.{{ include "visa-k8s-controller.namespace" . }}:{{ .Values.service.healthPort | default .Values.healthProbes.port | default 8081 }}/healthz']
  restartPolicy: Never
{{- end }}
{{- if .Values.webCloudProvider.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "visa-k8s-web-cloud-provider.fullname" . }}-test-connection"
  namespace: {{ include "visa-k8s-web-cloud-provider.namespace" . }}
  labels:
    {{- include "visa-k8s-web-cloud-provider.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '-', 'http://{{ include "visa-k8s-web-cloud-provider.fullname" . }}.{{ include "visa-k8s-web-cloud-provider.namespace" . }}:{{ .Values.webCloudProvider.service.port }}/healthz']
  restartPolicy: Never
{{- end }}
