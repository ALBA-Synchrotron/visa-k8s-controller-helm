apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "visa-k8s-controller.fullname" . }}-test-connection"
  labels:
    {{- include "visa-k8s-controller.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '-', 'http://{{ include "visa-k8s-controller.fullname" . }}:{{ .Values.service.healthPort | default .Values.healthProbes.port | default 8081 }}/healthz']
  restartPolicy: Never
