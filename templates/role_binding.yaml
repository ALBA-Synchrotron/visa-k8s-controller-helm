{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "visa-k8s-controller.fullname" . }}-manager-rolebinding
  labels:
    {{- include "visa-k8s-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "visa-k8s-controller.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "visa-k8s-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "visa-k8s-controller.fullname" . }}-leader-election-rolebinding
  labels:
    {{- include "visa-k8s-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "visa-k8s-controller.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "visa-k8s-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
