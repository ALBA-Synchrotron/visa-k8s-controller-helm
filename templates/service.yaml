apiVersion: v1
kind: Service
metadata:
  name: {{ include "visa-k8s-controller.fullname" . }}
  labels:
    {{- include "visa-k8s-controller.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default "metrics" }}
      protocol: TCP
      name: {{ if .Values.metrics.secure }}https{{ else }}http-metrics{{ end }}
    {{- end }}
    {{- if .Values.service.healthPort }}
    - port: {{ .Values.service.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
    {{- end }}
  selector:
    {{- include "visa-k8s-controller.selectorLabels" . | nindent 4 }}
