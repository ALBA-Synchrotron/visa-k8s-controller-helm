{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "visa-k8s-controller.fullname" . }}-manager-role
  labels:
    {{- include "visa-k8s-controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visaclouddevices
  - visacloudflavours
  - visacloudimages
  - visacloudsecuritygroups
  - visasidecarconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visainstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visainstances/finalizers
  verbs:
  - update
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visainstances/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "visa-k8s-controller.fullname" . }}-leader-election-role
  labels:
    {{- include "visa-k8s-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
{{- end }}
