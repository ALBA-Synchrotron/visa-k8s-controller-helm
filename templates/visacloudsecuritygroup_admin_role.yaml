{{- if and .Values.rbac.create .Values.rbac.createAdminRoles -}}
# This rule is not used by the project visa-k8s-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cloudprovider.visa.k8s.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "visa-k8s-controller.fullname" . }}-visacloudsecuritygroup-admin-role
  labels:
    {{- include "visa-k8s-controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visacloudsecuritygroups
  verbs:
  - '*'
- apiGroups:
  - cloudprovider.visa.k8s
  resources:
  - visacloudsecuritygroups/status
  verbs:
  - get
{{- end }}
