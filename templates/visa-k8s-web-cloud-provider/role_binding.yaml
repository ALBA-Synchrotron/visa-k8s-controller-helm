{{- if and .Values.webCloudProvider.enabled .Values.webCloudProvider.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.webCloudProvider.rbac.clusterScoped }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "visa-k8s-web-cloud-provider.fullname" . }}-rolebinding
  labels:
    {{- include "visa-k8s-web-cloud-provider.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "visa-k8s-web-cloud-provider.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "visa-k8s-web-cloud-provider.serviceAccountName" . }}
    namespace: {{ include "visa-k8s-web-cloud-provider.namespace" . }}
{{- else }}
kind: RoleBinding
metadata:
  name: {{ include "visa-k8s-web-cloud-provider.fullname" . }}-rolebinding
  namespace: {{ default (include "visa-k8s-web-cloud-provider.namespace" .) .Values.webCloudProvider.config.k8sNamespace }}
  labels:
    {{- include "visa-k8s-web-cloud-provider.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "visa-k8s-web-cloud-provider.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "visa-k8s-web-cloud-provider.serviceAccountName" . }}
    namespace: {{ include "visa-k8s-web-cloud-provider.namespace" . }}
{{- end }}
{{- end }}
