{{- if and .Values.webCloudProvider.enabled .Values.webCloudProvider.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "visa-k8s-web-cloud-provider.fullname" . }}
  labels:
    {{- include "visa-k8s-web-cloud-provider.labels" . | nindent 4 }}
spec:
  {{- if .Values.webCloudProvider.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.webCloudProvider.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.webCloudProvider.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.webCloudProvider.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "visa-k8s-web-cloud-provider.selectorLabels" . | nindent 6 }}
{{- end }}
