{{- if and .Values.webCloudProvider.enabled .Values.webCloudProvider.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "visa-k8s-web-cloud-provider.serviceAccountName" . }}
  namespace: {{ include "visa-k8s-web-cloud-provider.namespace" . }}
  labels:
    {{- include "visa-k8s-web-cloud-provider.labels" . | nindent 4 }}
  {{- with .Values.webCloudProvider.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.webCloudProvider.serviceAccount.automount }}
{{- end }}
