controller:
  # Enable or disable the VISA Kubernetes Controller deployment
  enabled: true

crds:
  # Specifies whether VISA Custom Resource Definitions should be installed (only installed if controller.enabled is true)
  install: true

replicaCount: 1

image:
  repository: misalbasynchrotron/visa-k8s-controller
  pullPolicy: IfNotPresent
  tag: latest

# Image pull secrets for the controller manager pod
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Specifies whether cluster-admin helper roles for VISA CRDs should be created
  createAdminRoles: true

# Controller scope configuration
# When set, limits the operator watch to specific namespace(s) (comma-separated).
# If empty, the controller watches all namespaces across the cluster.
operatorScopeNamespace: ""

# Comma-separated list of image pull secret names to pass to VISA instances managed by the controller.
managedImagePullSecrets: ""

# Leader election ensures only one active controller manager runs at a time in HA setups.
leaderElection:
  enabled: true

# Health probe configuration (healthz and readyz)
healthProbes:
  bindAddress: ":8081"
  port: 8081

# Controller metrics endpoint configuration
metrics:
  # Enable Prometheus metrics endpoint
  enabled: true
  # Bind address for the metrics endpoint. Set to "0" to disable.
  bindAddress: ":8443"
  # Port number for the metrics endpoint
  port: 8443
  # If true, the metrics endpoint is served securely via HTTPS with authn/authz filter
  secure: true
  # Path to certificates for securing metrics (optional)
  certPath: ""
  certName: "tls.crt"
  certKey: "tls.key"

# Webhook server certificate configuration (optional)
webhook:
  certPath: ""
  certName: "tls.crt"
  certKey: "tls.key"

# Enable HTTP/2 for metrics and webhook servers (disabled by default due to CVE vulnerabilities)
enableHttp2: false

# Additional command-line arguments to pass to the controller binary
extraArgs: []

# Additional environment variables to pass to the controller container
env: []

# Additional environment variables from configmaps/secrets
envFrom: []

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Controller Service configuration
service:
  type: ClusterIP
  # Metrics service port
  port: 8443
  targetPort: 8443
  # Health probe service port
  healthPort: 8081
  annotations: {}

# Resource requests and limits for the controller container
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Additional volumes and volume mounts
volumes: []
volumeMounts: []

# Node scheduling options
nodeSelector: {}
tolerations: []
affinity: {}

# VISA Web Cloud Provider configuration
webCloudProvider:
  # Enable or disable the VISA Web Cloud Provider deployment
  enabled: false

  replicaCount: 1

  image:
    repository: misalbasynchrotron/visa-k8s-web-cloud-provider
    pullPolicy: IfNotPresent
    tag: latest

  # Image pull secrets for the web cloud provider pod
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    # Specifies whether a service account should be created for web cloud provider
    create: true
    # Automatically mount a ServiceAccount's API credentials
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use. If not set and create is true, a name is generated using the fullname template
    name: ""

  rbac:
    # Specifies whether RBAC resources should be created for web cloud provider
    create: true
    # If true, creates ClusterRole and ClusterRoleBinding instead of namespaced Role and RoleBinding
    clusterScoped: false

  # Application configuration for the VISA Web Cloud Provider (stored in ConfigMap)
  config:
    # Secret API key used to authenticate incoming API requests.
    # If left empty, a secure random 32-character alphanumeric key will be automatically generated by the chart.
    authApiKey: ""

    # HTTP Header name inspected for the authentication token
    authApiKeyHeaderName: "X-Auth-Token"

    # Application environment profile ('prod', 'dev', 'test')
    flaskEnv: "prod"

    # Test profile mode ('unit', 'integration')
    testingMode: "unit"

    # Kubernetes configuration loader mechanism ('serviceaccount', 'kubeconfig')
    k8sConfigSource: "serviceaccount"

    # Path to kubeconfig file when using 'kubeconfig' mode
    k8sConfigFilePath: "~/.kube/config"

    # Kubernetes namespace where VISA CRD instances and resources reside.
    # If empty, defaults to the release namespace.
    k8sNamespace: ""

    # Python logging level ('DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL')
    logLevel: "INFO"

    # Host address to bind the HTTP server
    apiHost: "0.0.0.0"

    # Port number to bind the HTTP server
    apiPort: 8000

    # Port for Gunicorn / Container runtime
    port: 8000

    # Automatically set instance desiredState to ACTIVE when creating new instances
    autoStartInstancesOnCreation: true

    # Maximum aggregate RAM quota in Megabytes (MB) across all instances (default: 51200 = 50 GB)
    maxRamAllocated: 51200

    # Maximum number of simultaneously running instances quota
    maxInstancesAllocated: 20

    # Maximum aggregate CPU cores quota across all instances
    maxCoresAllocated: 15

    # If true, ignore non-existent security groups during instance creation instead of aborting
    ignoreSecGroupNotFoundErrors: true

    # Enforce instance/CPU/RAM quota validation during instance creation
    enforceMaxQuotas: true

    # Gunicorn worker concurrency
    webConcurrency: 2

    # Gunicorn threads per worker
    gunicornThreads: 4

    # Additional custom key-value pairs to add to the ConfigMap
    extraConfig: {}

  # If set, use an existing ConfigMap instead of creating one
  existingConfigMap: ""

  # If true, overwrites ConfigMap data on helm upgrade (default false preserves existing ConfigMap on upgrade)
  forceOverwriteConfigMap: false

  # Annotations to add to the ConfigMap
  configMapAnnotations: {}

  # Additional environment variables to pass to the container
  env: []

  # Additional environment variables from configmaps/secrets
  envFrom: []

  # Pod annotations and labels
  podAnnotations: {}
  podLabels: {}

  # Pod Security Context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  # Container Security Context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  # Web Cloud Provider Service configuration
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: visa-web-provider.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Resource requests and limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: 1

  # Additional volumes and volume mounts
  volumes: []
  volumeMounts: []

  # Node scheduling options
  nodeSelector: {}
  tolerations: []
  affinity: {}
